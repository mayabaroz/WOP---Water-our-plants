services:
  wop:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir app"
    ports:
      - "3000:8080"
    volumes:
      - ./backend:/app
      - wop-data:/data
      - pip-cache:/root/.cache/pip
    environment:
      - WOP_DB_PATH=/data/wop.db
      - WOP_IMAGES_DIR=/data/images
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/api/plants', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 90s

volumes:
  wop-data:
  pip-cache:
