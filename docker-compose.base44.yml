services:
  wop:
    image: python:3.12-slim
    container_name: wop-backend
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:8080"
    volumes:
      # Bind-mount the source so edits hot-reload without rebuilding
      - ./backend:/app
      # Persistent SQLite database + uploaded images
      - wop-data:/app/data
    environment:
      - WOP_DB_PATH=/app/data/wop.db
      - WOP_IMAGES_DIR=/app/data/images
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/', timeout=5).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  wop-data:
